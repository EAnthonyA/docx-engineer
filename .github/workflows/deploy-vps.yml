name: Deploy to VPS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create directories on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ~/docx-engineer/jobs ~/lazyfood/nginx/conf.d/certs

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/docx-engineer

      - name: Copy nginx vhost to shared proxy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: nginx/conf.d/docx-engineer.conf
          target: ~/lazyfood

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          CLOUDFLARE_ORIGIN_CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
          CLOUDFLARE_ORIGIN_KEY_B64: ${{ secrets.CLOUDFLARE_ORIGIN_KEY_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,ADMIN_PASSWORD_HASH,SESSION_SECRET,DEEPSEEK_API_KEY,CORS_ORIGINS,CLOUDFLARE_ORIGIN_CERT_B64,CLOUDFLARE_ORIGIN_KEY_B64
          script: |
            set -e
            cd ~/docx-engineer
            # The executor starts nested Docker containers. They need the host
            # path behind /jobs, not a path inside the executor container.
            export JOBS_HOST_DIR="$PWD/jobs"
            mkdir -p "$JOBS_HOST_DIR"

            # One-time migration from the prior named volume. Avoid losing a
            # recent result just because the safer nested-bind layout is being
            # introduced. The copy is skipped once the bind directory has data.
            if docker volume inspect docx-engineer-jobs >/dev/null 2>&1 \
              && [ -z "$(find "$JOBS_HOST_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              docker run --rm \
                -v docx-engineer-jobs:/from:ro \
                -v "$JOBS_HOST_DIR":/to \
                alpine sh -c 'cp -a /from/. /to/'
            fi

            test -n "$CLOUDFLARE_ORIGIN_CERT_B64"
            test -n "$CLOUDFLARE_ORIGIN_KEY_B64"
            umask 077
            printf '%s' "$CLOUDFLARE_ORIGIN_CERT_B64" | base64 -d > ~/lazyfood/nginx/conf.d/certs/sangri.tech.pem
            printf '%s' "$CLOUDFLARE_ORIGIN_KEY_B64" | base64 -d > ~/lazyfood/nginx/conf.d/certs/sangri.tech.key
            chmod 600 ~/lazyfood/nginx/conf.d/certs/sangri.tech.key

            docker network create shared-proxy || true
            docker network inspect docx-engineer-sandbox-net >/dev/null 2>&1 \
              || docker network create --internal docx-engineer-sandbox-net

            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull sandbox image on VPS so executor can use it
            docker pull "$DOCKERHUB_USERNAME/docx-engineer:sandbox-$IMAGE_TAG"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker exec lazyfood-nginx-prod nginx -t
            docker exec lazyfood-nginx-prod nginx -s reload

            # Check the backend and its HTTPS route through the shared proxy.
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" \
                && curl -kfsS --max-time 5 --resolve sangri.tech:443:127.0.0.1 https://sangri.tech/ -o /tmp/docx-deploy-response \
                && grep -Fq '<title>docx-engineer</title>' /tmp/docx-deploy-response; then
                echo "Health check passed"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for backend and proxy route... ($i/10)"
              sleep 5
            done
            echo "Health check failed" && exit 1
