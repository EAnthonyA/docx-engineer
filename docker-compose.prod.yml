services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:frontend-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    container_name: docx-engineer-frontend
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - shared-proxy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  backend:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:backend-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    restart: unless-stopped
    volumes:
      # This must be a host bind mount: the executor passes individual job
      # files to nested Docker sandbox containers using their host paths.
      - ${JOBS_HOST_DIR:?Set JOBS_HOST_DIR to an absolute writable host directory}:/jobs
    environment:
      - JOBS_DIR=/jobs
      - EXECUTOR_URL=http://executor:8001
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      # Must exceed the executor's sandbox timeout so the backend does not
      # report a false transport timeout for a long document.
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-180}
      - SECURE_COOKIES=true
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sangri.tech}
    depends_on:
      - executor
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  executor:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:executor-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JOBS_HOST_DIR:?Set JOBS_HOST_DIR to an absolute writable host directory}:/jobs
    environment:
      - JOBS_DIR=/jobs
      - HOST_JOBS_DIR=${JOBS_HOST_DIR:?Set JOBS_HOST_DIR to an absolute writable host directory}
      - SANDBOX_IMAGE=${DOCKERHUB_USERNAME}/docx-engineer:sandbox-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
      # A bounded allowance for long, heavily formatted Word files. Jobs are
      # serialized by the backend, so only one sandbox may use it at once.
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-180}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-1500m}
      - SANDBOX_NETWORK=docx-engineer-sandbox-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  scraper:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:scraper-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    restart: unless-stopped
    networks:
      - default
      - sandbox-net
    environment:
      - SCRAPE_MAX_BYTES=${SCRAPE_MAX_BYTES:-1048576}
      - SCRAPE_TIMEOUT=${SCRAPE_TIMEOUT:-15}
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

networks:
  sandbox-net:
    name: docx-engineer-sandbox-net
    # The executor already creates this internal network on older deployments.
    # Treat it as external so Compose can attach the scraper without relabeling it.
    external: true
  shared-proxy:
    external: true
