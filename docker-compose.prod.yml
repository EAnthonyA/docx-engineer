services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:frontend-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    container_name: docx-engineer-frontend
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - shared-proxy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  backend:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:backend-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    restart: unless-stopped
    volumes:
      - jobs_data:/jobs
    environment:
      - JOBS_DIR=/jobs
      - EXECUTOR_URL=http://executor:8001
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - SECURE_COOKIES=true
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sangri.tech}
    depends_on:
      - executor
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"

  executor:
    image: ${DOCKERHUB_USERNAME}/docx-engineer:executor-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jobs_data:/jobs
    environment:
      - JOBS_DIR=/jobs
      - SANDBOX_IMAGE=${DOCKERHUB_USERNAME}/docx-engineer:sandbox-${IMAGE_TAG:?Set IMAGE_TAG to the deployment commit SHA}
      - SANDBOX_TIMEOUT=30
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-1g}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  jobs_data:
    name: docx-engineer-jobs

networks:
  shared-proxy:
    external: true
