services:
  frontend:
    image: ${USER}-docx-engineer-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.mts:/app/vite.config.mts
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    image: ${USER}-docx-engineer-backend
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests:ro
      - ./sandbox/docxkit.py:/sandbox/docxkit.py:ro
      - ./sandbox/document_io.py:/sandbox/document_io.py:ro
      - ./executor:/executor:ro
      - ./jobs:/jobs
    environment:
      - JOBS_DIR=/jobs
      - LOG_LEVEL=DEBUG
      - EXECUTOR_URL=http://executor:8001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - CORS_ORIGINS=http://localhost:3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    depends_on:
      - executor

  executor:
    image: ${USER}-docx-engineer-executor
    build:
      context: executor
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jobs:/jobs
    environment:
      - JOBS_DIR=/jobs
      - HOST_JOBS_DIR=${PWD}/jobs
      - LOG_LEVEL=DEBUG
      - SANDBOX_IMAGE=docx-sandbox
      - SANDBOX_TIMEOUT=120
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-1536m}
      - SANDBOX_NETWORK=${USER}-docx-engineer-sandbox-net

  scraper:
    image: ${USER}-docx-engineer-scraper
    build:
      context: scraper
      dockerfile: Dockerfile
    networks:
      - default
      - sandbox-net
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCRAPE_MAX_BYTES=${SCRAPE_MAX_BYTES:-1048576}
      - SCRAPE_TIMEOUT=${SCRAPE_TIMEOUT:-15}

networks:
  sandbox-net:
    name: ${USER}-docx-engineer-sandbox-net
    internal: true
