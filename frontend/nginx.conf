upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Keep the app out of indexes used by compliant crawlers. Sensitive API
    # endpoints remain protected by the backend session checks.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The SPA only has these client-side routes. Let unknown paths return a
    # real 404 instead of loading the authenticated application shell.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /login {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/jobs/[^/]+$ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Preserve the browser's requested URL while internally rendering the
    # branded React 404 screen. nginx retains the 404 response status.
    error_page 404 /index.html;

    location / {
        root /usr/share/nginx/html;
        try_files $uri =404;

        location ~* \.(js|css|woff|woff2|ico|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
