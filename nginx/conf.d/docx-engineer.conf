server {
    listen 80;
    listen [::]:80;
    server_name sangri.tech www.sangri.tech;

    # Resolve the frontend when a request arrives, so nginx can start while
    # docx-engineer is stopped or being redeployed.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $docx_upstream docx-engineer-frontend:80;
        proxy_pass http://$docx_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }
}
