server {
    listen 80;
    listen [::]:80;
    server_name sangri.tech www.sangri.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sangri.tech www.sangri.tech;

    ssl_certificate /etc/nginx/conf.d/certs/sangri.tech.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/sangri.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $docx_upstream docx-engineer-frontend:80;
        proxy_pass http://$docx_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 55m;
    }
}
